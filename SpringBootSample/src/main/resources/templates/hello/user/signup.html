<!DOCTYPE html>
<html xmlns:th ="http://www.thymeleaf.org" >
<head>
<meta charset ="UTF-8" ></meta>
<meta name ="viewport" content ="width=device-width, initial-scale=1, shrink-to-fit=no" >

<!-- Read CSS -->
<link rel ="stylesheet" th:href ="@{/webjars/bootstrap/css/bootstrap.min.css}" >
<link rel ="stylesheet" th:href ="@{/css/user/signup.css}" >
<!-- Read JS -->
<script th:src ="@{/webjars/jquery/jquery.min.js}" defer ></script>
<script th:src ="@{/webjars/bootstrap/js/bootstrap.min.js}" defer ></script>
<title th:text ="#{hello.user.signup.title}"> UserSignup</title>
</head>
<body class ="bg-light" >
<form id ="signup-form" method ="post" action ="/user/sign up" class ="form-signup"  th:object ="${signupForm}">
<h1 class ="text-center" th:text ="#{user.signup.title}" > UserSignup</h1>
<!-- User ID -->
<div class ="form-group" >
<label for ="userId" th:text ="#{userId}"> User ID</label>
<input type ="text" class ="form-control"  />

</div>
<!-- Password -->
<div class ="form-group" >
<label for ="password" th:text ="#{password}"> Password</label>
<input type ="text" class ="form-control"  />

</div>
<!-- User Name -->
<div class ="form-group" >
<label for ="userName" th:text ="#{userName}"> User Name</label>
<input type ="text" class ="form-control"  />

</div>
<!-- Birthday -->
<div class ="form-group" >
<label for ="birthday"  th:text ="#{birthday}"> Birthday</label>
<input type ="text" class ="form-control"  placeholder ="dd/MM/yyyy" />

</div>
<!-- Age -->
<div class ="form-group" >
<label for ="age" th:text ="#{age}" > Age</label>
<input type ="text" class ="form-control"  />
>
</div>
<!-- Gender -->
<div class ="form-group" >
<div th:each ="item : ${genderMap}" class ="form-check-inline">
<input type ="radio" class ="form-check-input" th:value ="${item.value}" />
<label class ="form-check-label" th:text ="${item.key}" ></label>


</div>
</div>
<!-- Signup button -->
<input type ="submit" value ="signup" th:value ="#{user.signup.btn}"
class ="btn btn-primary w-100 mt-3" />
</form>
</body>
</html>
